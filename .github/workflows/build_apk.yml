name: Build Android APK

on:
  workflow_dispatch:        # lets you press "Run workflow" in the Actions tab
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create a fresh Flutter project and put our files in it
        run: |
          flutter create --platforms=android --project-name filter_counter --org com.example build_app
          cp app/pubspec.yaml build_app/pubspec.yaml
          cp app/lib/main.dart build_app/lib/main.dart
          rm -rf build_app/test build_app/analysis_options.yaml

      - name: Allow network access in the Android manifest
        working-directory: build_app
        run: python3 ../app/patch_manifest.py

      - name: Build the APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: filter-counter-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
